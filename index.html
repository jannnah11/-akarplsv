.deck{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;padding:14px 40px 18px 211px}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px;flex:none}
h1{font-weight:700;font-size:30px;line-height:1.2;margin:0;background:var(--card);border:3px solid var(--ink);border-radius:99px;padding:6px 30px;box-shadow:0 5px 0 var(--ink)}
button,select{font-family:Poppins,system-ui,sans-serif;font-size:20px}
button{font-weight:600;color:#fff;background:var(--btn);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:8px 22px;cursor:pointer;min-height:54px;text-align:left;line-height:1.3}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:4px solid var(--ball2);outline-offset:2px}
button.alt{background:var(--btn2);text-align:center}
button.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--ink);text-align:center}
button.ok{background:#1E9E6E}button.no{background:#D14B6E}
.steps{display:flex;gap:14px;flex:none}
.pl{flex:auto;white-space:nowrap;justify-content:center;display:flex;align-items:center;gap:10px;font-weight:600;padding:6px 12px;min-height:54px;border:3px solid var(--ink);border-radius:99px;background:var(--card);color:var(--ink2)}
.pl i{font-style:normal;flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:3px solid var(--ink2);color:var(--ink2);font-weight:700}
.pl.on{background:var(--btn);color:#fff}
.pl.on i{background:var(--sun);color:#12305E;border-color:var(--ink)}
.pl.ok{background:#8FE3C0;color:#0B3A2A}
.pl.ok i{background:#fff;color:var(--ok);border-color:var(--ok)}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.col{display:flex;flex-direction:column;gap:14px;min-height:0}
.card{background:var(--card);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:14px 22px}
.chip{display:inline-block;font-weight:700;background:var(--sun);color:#12305E;border:3px solid var(--ink);border-radius:99px;padding:0 18px;margin-bottom:8px}
#stext{margin:0}
mark{background:rgba(255,201,77,.7);color:#12305E;padding:0 6px;border-radius:6px;font-weight:600}
.coach{display:flex;gap:18px;align-items:center}
#mas{width:100px;flex:none}
#mas.hop{animation:hop .5s}
@keyframes hop{30%{transform:translateY(-14px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
.bub{position:relative;flex:1;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:10px 20px}
.bub:before{content:"";position:absolute;left:-13px;top:40px;width:20px;height:20px;background:var(--paper);border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
#story{margin:0;color:var(--ink2);font-weight:500}
#ask{margin:0;font-weight:700}
#how{margin:4px 0 0;color:var(--ink2)}
.ttl{font-weight:700;margin:0 0 6px;color:var(--ink2)}
#ansCard{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
#ins{align-self:flex-start;font-weight:700;background:var(--sun);color:#12305E;border:3px solid var(--ink);border-radius:16px;padding:4px 18px}
#ctl{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
#ctl>button{width:100%;flex:1;max-height:100px}
#ctl>button.ghost{flex:none}
.ng{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ng.three{grid-template-columns:repeat(3,1fr)}
.ng button{text-align:center;padding:8px 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;max-height:100px}
.two button{text-align:center}
#fb{min-height:64px;font-weight:600}
#fb.ok{color:var(--ok)}#fb.bad{color:var(--bad)}
#scale{flex:none}
#eqw{text-align:center;margin-top:4px}
#eq{font-weight:700;font-size:36px;line-height:1.3}
#ver{font-weight:700}
#ver.ok{color:var(--ok)}#ver.bad{color:var(--bad)}
.leg{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin-top:6px;color:var(--ink2);font-weight:500}
.leg i{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);margin-right:8px;vertical-align:-2px}
#logCard{flex:1;display:flex;flex-direction:column;min-height:0}
#log{flex:1;min-height:0;align-content:start;background:var(--paper) repeating-linear-gradient(transparent 0 43px,var(--line) 43px 45px);border:3px dashed var(--ink2);border-radius:18px;padding:0 20px}
.lg{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:baseline;line-height:45px;height:45px;white-space:nowrap}
.lg b{font-weight:700}.lg span{color:var(--ink2)}
.lg em{font-style:normal;font-weight:700}
.lg em.ok{color:var(--ok)}.lg em.bad{color:var(--bad)}
.lg.w{display:block}
.cf{position:fixed;top:-20px;width:12px;height:16px;border-radius:2px;animation:fall 2.6s linear forwards;pointer-events:none;z-index:9}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.cf,#mas.hop{animation:none}}
.bx{fill:#2F7BEF;stroke:var(--ink);stroke-width:2.5}
#rot{display:none}
@media (orientation:portrait) and (max-width:700px){#rot{display:flex;position:fixed;inset:0;z-index:20;background:var(--bg);color:var(--ink);align-items:center;justify-content:center;text-align:center;padding:24px;font-size:18px;font-weight:700}}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><div class="deck">
<header class="top"><h1>Permen Ajaib: Akar dan Bukan Akar PLSV</h1><button id="rs" class="ghost">Ulangi dari awal</button></header>
<div class="steps" id="steps" aria-label="Empat kegiatan"></div>
<div class="grid">
<div class="col">
<div class="card"><span class="chip" id="stitle"></span><p id="stext"></p></div>
<div class="card"><div class="coach">
<svg id="mas" viewBox="0 0 80 80" aria-hidden="true"><rect x="12" y="26" width="56" height="46" rx="9" class="bx"/><rect x="7" y="14" width="66" height="16" rx="7" class="bx"/><path d="M40 14v16" stroke="#12305E" stroke-width="2.5"/><circle cx="29" cy="47" r="4.5" fill="#fff"/><circle cx="51" cy="47" r="4.5" fill="#fff"/><circle cx="22" cy="56" r="4" fill="#FF9DB8"/><circle cx="58" cy="56" r="4" fill="#FF9DB8"/><path id="mth" d="M33 58q7 8 14 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
<div class="bub"><p id="story"></p><p id="ask"></p><p id="how"></p></div>
</div></div>
<div class="card" id="ansCard"><p class="ttl">Kotak Jawaban</p><div id="ins"></div><div id="ctl"></div><div id="fb" role="status"></div></div>
</div>
<div class="col">
<div class="card" id="scale"><svg id="sc" viewBox="0 12 680 284" style="display:block;width:80%;margin:0 auto" role="img" aria-label="Timbangan permen"><g id="dyn"></g></svg>
<div id="eqw"><div id="eq"></div><div id="ver"></div></div>
<div class="leg"><span><i style="background:#FF9F43"></i>permen di toples</span><span><i style="background:#FF6FA5"></i>isi kantong (x)</span><span><i style="background:#4CD08A"></i>jumlah akhir</span></div></div>
<div class="card" id="logCard"><p class="ttl">Tabel percobaan</p><div id="log" aria-live="polite"></div></div>
</div>
</div>
</div></div></div>
<div id="rot">Putar layar ke posisi landscape ya</div>
<script>
function $(i){return document.getElementById(i)}
function fit(){var k=Math.min(innerWidth/1920,innerHeight/1080),w=$('wrap'),s=$('stage');s.style.transform='scale('+k+')';w.style.width=1920*k+'px';w.style.height=1080*k+'px';w.style.marginLeft=-960*k+'px';w.style.marginTop=-540*k+'px'}
var P=[{a:4,T:7,root:3},{a:6,T:10,root:4}];
var NAMES=['Memahami','Mencoba','Menggolongkan','Menerapkan'];

function eqShow(){var p=cur(),eq=$('eq'),v=$('ver');
 if(!S.fill){eq.textContent='x + '+p.a+' = '+p.T;v.textContent='x belum diganti angka';v.className='';return}
 var n=S.fill,t=n+p.a;
 if(S.hide){eq.textContent=n+' + '+p.a+' = ?';v.textContent='Menurutmu, apakah kalimatnya benar atau salah?';v.className='';return}
 if(t===p.T){eq.textContent=n+' + '+p.a+' = '+p.T;v.textContent='\u2713 Timbangan seimbang: kalimat BENAR';v.className='ok'}
 else{eq.textContent=n+' + '+p.a+' = '+t+', padahal '+p.T;v.textContent='\u2717 Timbangan miring: kalimat SALAH';v.className='bad'}}
function render(){
 var st=$('steps');st.innerHTML='';
 NAMES.forEach(function(n,i){var d=document.createElement('div'),ok=S.done||i<S.ph,on=!S.done&&i===S.ph;d.className='pl'+(on?' on':'')+(ok?' ok':'');d.innerHTML='<i>'+(ok?'\u2713':(i+1))+'</i><span>Kegiatan '+(i+1)+': '+n+'</span>';st.appendChild(d)});

 if(!S.log.length){var e=document.createElement('div');e.className='lg w';e.innerHTML='<span>Belum ada catatan. Hasil percobaanmu akan tercatat di sini.</span>';lg.appendChild(e)}
 S.log.forEach(function(l){var d=document.createElement('div');d.className='lg';d.innerHTML='<b></b><span></span><em></em>';d.children[0].textContent=l.a;d.children[1].textContent=l.b;d.children[2].textContent=l.c;d.children[2].className=l.k||'';lg.appendChild(d)});
 draw(S.th)}
function mood(k){$('mth').setAttribute('d',k==='ok'?'M31 56q9 12 18 0':k==='bad'?'M33 64q7-8 14 0':'M34 60h12');var m=$('mas');m.classList.remove('hop');void m.offsetWidth;if(k)m.classList.add('hop')}
function say(t,k){var f=$('fb');f.textContent=t;f.className=k||'';mood(k||'');if(k==='bad')S.err++}
function boom(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;var cols=['#FF9F43','#FF6FA5','#4CD08A','#FFC94D'];for(var i=0;i<44;i++){var s=document.createElement('span');s.className='cf';s.style.left=Math.random()*100+'vw';s.style.background=cols[i%4];s.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(s);setTimeout(function(x){x.remove()},3600,s)}}
function setBtns(a,cls){var c=$('ctl');c.innerHTML='';var host=c;if(cls){host=document.createElement('div');host.className=cls;c.appendChild(host)}
 a.forEach(function(x){var b=document.createElement('button');b.innerHTML=x[0];if(x[2])b.className=x[2];b.onclick=x[1];host.appendChild(b)});return c}

function setProb(i){S.pi=i;S.fill=0;S.hide=false;S.tried={};S.fT=false;S.fF=false;S.log=[];S.th=0}
/* Kegiatan 1 */
function ph0(){S.ph=0;setProb(0);var p=cur();
 T('Soal cerita: Toples permen','Rani punya <mark>4 permen</mark> di dalam toples. Kakak memasukkan <mark>sekantong permen</mark> yang isinya belum diketahui, kita sebut <mark>x</mark>. Sekarang toples berisi <mark>7 permen</mark>. Ayo cari tahu apa itu akar dan bukan akar PLSV!');
 render();Q('Halo! Hari ini kita belajar lewat permen.','Kegiatan 1: Ubah cerita menjadi persamaan.','Lihat timbangan di kanan. Kiri = kantong x + 4 permen, kanan = 7 permen. Cocokkan dengan pilihan di bawah.');
 G('Pilihlah persamaan yang cocok di kotak bawah ini');say('');
 choice(['x + 4 = 7','x \u2212 4 = 7','4x = 7'],'x + 4 = 7',function(){S.log.push({a:'Model',b:'x + 4 = 7',c:'PLSV',k:'ok'});render();say('Tepat! Persamaan ini disebut PLSV (persamaan linear satu variabel), variabelnya hanya x.','ok');nextBtn('Lanjut ke Kegiatan 2',ph1)},
 function(){say('Belum cocok. Ada 4 permen di toples ditambah x permen dari kantong, hasilnya 7.','bad')})}
/* Kegiatan 2 */
function ph1(){S.ph=1;setProb(0);var p=cur();
 T('Kegiatan 2: Coba isi kantong','Kantong x sekarang akan kita isi dengan <mark>sebuah angka</mark>. Angka itu menggantikan x. Lihat apakah jumlah permen di kiri <mark>sama dengan 7</mark>.');
 render();Q('Kita buka kantongnya!','Kegiatan 2: Coba beberapa angka untuk mengganti x.','Tekan satu angka, perhatikan timbangan dan kalimat di bawahnya. Cari angka yang membuat BENAR dan satu yang membuat SALAH.');
 G('Tekanlah salah satu angka di kotak bawah ini');say('');trialUI()}
function trialUI(){var nums=[1,2,3,4,5,6,7,8],c=setBtns(nums.map(function(n){return ['x = '+n,function(){trial(n)},'']}),'ng');
 var b=document.createElement('button');b.textContent='Petunjuk';b.className='ghost';b.onclick=hint1;c.appendChild(b)}
function trial(n){var p=cur();S.fill=n;S.hide=false;var t=n+p.a,ok=t===p.T;
 if(!S.tried[n]){S.tried[n]=1;S.log.push({a:'x = '+n,b:n+' + '+p.a+' = '+t+(ok?'':' \u2260 '+p.T),c:ok?'Benar':'Salah',k:ok?'ok':'bad'});if(ok)S.fT=true;else S.fF=true}
 render();anim(tgt(),function(){
  if(ok)say(n+' + '+p.a+' = '+p.T+' sama, jadi kalimat BENAR. Angka '+n+' disebut AKAR PLSV.','ok');
  else say(n+' + '+p.a+' = '+t+', tidak sama dengan '+p.T+'. Kalimat SALAH, jadi '+n+' BUKAN akar.','bad');
  if(S.fT&&S.fF){S.fill=S.fill;G('Hebat! Tekan tombol di bawah ini untuk lanjut');var c=$('ctl');var b=document.createElement('button');b.className='alt';b.textContent='Lanjut ke Kegiatan 3';b.onclick=ph2;c.innerHTML='';c.appendChild(b);boom()}
  else if(S.fT)G('Sekarang coba angka lain yang membuat SALAH');
  else if(S.fF)G('Coba angka lain sampai timbangan seimbang')})}
function hint1(){var p=cur(),l=S.fill;if(!l)say('Coba tebak: 4 permen ditambah isi kantong harus tepat 7. Tekan satu angka dulu.');else if(l+p.a>p.T)say('Terlalu banyak. Coba angka yang lebih kecil.');else if(l+p.a<p.T)say('Masih kurang. Coba angka yang lebih besar.');else say('Angka itu sudah benar. Coba satu angka lain untuk dibandingkan.')}
/* Kegiatan 3 */
function ph2(){S.ph=2;setProb(0);S.q=shuf([6,3,2,5]);S.qi=0;var p=cur();
 T('Kegiatan 3: Akar atau bukan akar?','Untuk persamaan <mark>x + 4 = 7</mark>: angka yang membuat kalimat <mark>BENAR</mark> disebut <mark>akar</mark>. Angka yang membuat kalimat <mark>SALAH</mark> disebut <mark>bukan akar</mark>.');
 render();askQ()}
function askQ(){var n=S.q[S.qi],p=cur();S.fill=n;S.hide=true;render();anim(tgt());
 Q('Angka ke-'+(S.qi+1)+' dari '+S.q.length,'Jika x diganti '+n+', apakah '+n+' akar dari x + 4 = 7?','Hitung '+n+' + 4, bandingkan dengan 7, lalu lihat juga timbangan di kanan.');
 G('Pilihlah Akar atau Bukan akar di kotak bawah ini');say('');
 var ok=n+p.a===p.T,c=$('ctl');c.innerHTML='';var d=document.createElement('div');d.className='two';
 [['Akar','ok'],['Bukan akar','no']].forEach(function(x,i){var b=document.createElement('button');b.textContent=x[0];b.className=x[1];b.onclick=function(){answerQ(i===0,ok,n)};d.appendChild(b)});c.appendChild(d)}
function answerQ(sayAkar,ok,n){var p=cur();
 if(sayAkar===ok){S.hide=false;S.log.push({a:'x = '+n,b:n+' + '+p.a+' = '+(n+p.a)+(ok?'':' \u2260 '+p.T),c:ok?'Akar':'Bukan akar',k:ok?'ok':'bad'});render();
  say(ok?'Tepat! '+n+' + '+p.a+' = '+p.T+' benar, jadi '+n+' adalah akar.':'Tepat! '+n+' + '+p.a+' = '+(n+p.a)+', tidak sama dengan '+p.T+', jadi '+n+' bukan akar.','ok');
  S.qi++;setTimeout(function(){if(S.qi<S.q.length)askQ();else{S.hide=false;boom();Q('Kamu hebat!','Semua angka sudah kamu golongkan.','');nextBtn('Lanjut ke Kegiatan 4',ph3);say('Akar = angka yang membuat kalimat benar. Bukan akar = angka yang membuat kalimat salah.','ok')}},1500);setBtns([])}
 else say(ok?'Belum tepat. Hitung lagi: '+n+' + '+p.a+' sama dengan '+p.T+'. Lihat timbangan, apakah seimbang?':'Belum tepat. Hitung lagi: '+n+' + '+p.a+' = '+(n+p.a)+', tidak sama dengan '+p.T+'.','bad')}
/* Kegiatan 4 */
function ph3(){S.ph=3;setProb(1);var p=cur();
 T('Soal baru: Permen Dito','Dito punya <mark>6 permen</mark> di toples. Ibu menambahkan <mark>sekantong permen berisi x buah</mark>, sehingga sekarang ada <mark>10 permen</mark>. Persamaannya <mark>x + 6 = 10</mark>.');
 render();Q('Sekarang giliranmu bekerja mandiri!','Kegiatan 4: Temukan akar dari x + 6 = 10.','Tekan satu angka untuk mengisi kantong, lihat timbangan, lalu temukan angka yang membuat seimbang.');
 G('Tekanlah satu angka di kotak bawah ini sampai kamu menemukan akarnya');say('');
 setBtns([3,4,5].map(function(n){return ['x = '+n,function(){try4(n)}]}),'ng three')}
function try4(n){var p=cur(),t=n+p.a,ok=t===p.T;S.fill=n;S.hide=false;
 if(!S.tried[n]){S.tried[n]=1;S.log.push({a:'x = '+n,b:n+' + '+p.a+' = '+t+(ok?'':' \u2260 '+p.T),c:ok?'Akar':'Bukan akar',k:ok?'ok':'bad'})}
 render();anim(tgt(),function(){
  if(ok){say('Seimbang! '+n+' + '+p.a+' = '+p.T+'. Angka '+n+' adalah akar x + 6 = 10.','ok');boom();setTimeout(concl1,1600);setBtns([])}
  else say(n+' + '+p.a+' = '+t+', tidak sama dengan '+p.T+'. Angka '+n+' bukan akar. Coba angka lain.','bad')})}
function concl1(){S.fill=cur().root;Q('Kesimpulan 1','Lengkapi kalimatnya: akar PLSV adalah ...','Ingat apa yang terjadi pada timbangan saat angka 3 menggantikan x.');
 G('Pilihlah kalimat yang tepat di kotak bawah ini');say('');
 var a='nilai pengganti x yang membuat kalimat bernilai benar';
 choice([a,'nilai pengganti x yang membuat kalimat bernilai salah','angka paling besar pada persamaan'],a,function(){S.stext='<mark>Akar PLSV</mark> adalah pengganti variabel yang membuat kalimat bernilai benar.';render();say('Tepat!','ok');setTimeout(concl2,1200);setBtns([])},
 function(){say('Belum tepat. Akar membuat timbangan seimbang, artinya kalimat bernilai benar.','bad')})}
function concl2(){S.pi=0;S.fill=5;S.hide=false;S.th=0;S.stitle='Kesimpulan 2';S.stext='Pada <mark>x + 4 = 7</mark>, angka <mark>5</mark> diganti pada x menjadi 5 + 4 = 9.';render();anim(tgt());
 Q('Kesimpulan 2','Mengapa 5 bukan akar dari x + 4 = 7?','Lihat timbangan di kanan: miring atau seimbang?');
 G('Pilihlah alasan yang benar di kotak bawah ini');say('');
 var a='Karena 5 + 4 = 9, tidak sama dengan 7 sehingga kalimat salah';
 choice([a,'Karena 5 lebih besar dari 4','Karena 5 + 4 = 7'],a,function(){say('Tepat! Itulah arti bukan akar.','ok');setTimeout(fin,1300);setBtns([])},
 function(){say('Belum tepat. Hitung 5 + 4 dan bandingkan dengan 7.','bad')})}
function fin(){S.done=true;S.fill=3;S.hide=false;S.th=0;S.log=[{a:'Akar',b:'pengganti x yang membuat kalimat BENAR',c:'',k:'ok'},{a:'Bukan akar',b:'pengganti x yang membuat kalimat SALAH',c:'',k:'bad'}];
 var st=S.err<=3?3:S.err<=7?2:1,sx='';for(var k=0;k<3;k++)sx+=k<st?'\u2605':'\u2606';
 S.stitle='Rangkuman';S.stext='<mark>Akar PLSV</mark>: nilai yang menggantikan variabel dan membuat kalimat bernilai <mark>benar</mark> (contoh: 3 pada x + 4 = 7). <mark>Bukan akar</mark>: nilai yang membuat kalimat bernilai <mark>salah</mark> (contoh: 5 pada x + 4 = 7).';
 render();anim(tgt());Q('Misi selesai! Nilai bintangmu: '+sx,'Kamu sudah bisa membedakan akar dan bukan akar PLSV.','');boom();
 G('Tekan tombol di bawah ini untuk mengulang');say('Hebat! Kamu paham akar dan bukan akar lewat permen.','ok');setBtns([['Main lagi',function(){init();ph0()},'alt']]);$('ins').textContent='[Tekan tombol di bawah ini untuk mengulang]'}
$('rs').onclick=function(){init();ph0()};
